<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paragon Health is now Jovia Health</title>
  <meta name="description" content="Health at Paragon AI now lives at Jovia Health. Redirecting you to joviahealth.com.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://joviahealth.com/">
  <meta http-equiv="refresh" content="5; url=https://joviahealth.com/">
  <meta name="theme-color" content="#1E4434">
  <meta property="og:title" content="Paragon Health is now Jovia Health">
  <meta property="og:description" content="Health at Paragon AI now lives at Jovia Health.">
  <meta property="og:url" content="https://health.paragon.ai/">
  <meta property="og:image" content="https://joviahealth.com/assets/og-image.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,350;1,9..144,300&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--green:#1E4434;--green-2:#2C5C47;--clay:#C8693F;--cream:#FBF8F2;--oat:#F3ECE1;--ink:#23221F;--muted:#615C53}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;display:grid;place-items:center;min-height:100vh;padding:32px 24px;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--oat),var(--cream));overflow:hidden;-webkit-font-smoothing:antialiased}
    .glow{position:fixed;width:620px;height:620px;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;z-index:0}
    .g1{background:radial-gradient(circle,#F0C3A6,transparent 65%);top:-220px;right:-120px;animation:d 18s ease-in-out infinite alternate}
    .g2{background:radial-gradient(circle,#BFD3BE,transparent 65%);bottom:-260px;left:-160px;animation:d 22s ease-in-out infinite alternate-reverse}
    @keyframes d{to{transform:translate(40px,30px) scale(1.08)}}
    main{position:relative;z-index:1;text-align:center;max-width:640px;animation:in .9s cubic-bezier(.2,.7,.2,1) both}
    @keyframes in{from{opacity:0;transform:translateY(16px)}}
    .brand{display:inline-flex;align-items:baseline;gap:8px;color:var(--green);text-decoration:none;margin-bottom:40px}
    .brand svg{width:36px;height:36px;align-self:center}
    .brand span{font-family:Fraunces,Georgia,serif;font-size:2rem;letter-spacing:-.03em;line-height:1}
    .eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--clay);margin:0 0 16px}
    h1{font-family:Fraunces,Georgia,serif;font-weight:350;font-size:clamp(2.1rem,5.5vw,3.4rem);line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance}
    h1 em{font-style:italic;font-weight:300;color:var(--green-2)}
    p.sub{color:var(--muted);font-size:1.05rem;line-height:1.6;margin:20px auto 0;max-width:30em}
    .btn{display:inline-flex;align-items:center;gap:10px;margin-top:34px;height:54px;padding:0 28px;border-radius:999px;background:var(--green);color:var(--cream);font-weight:600;text-decoration:none;transition:transform .3s,box-shadow .3s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(30,68,52,.55)}
    .btn svg{width:18px;height:18px;transition:transform .3s}
    .btn:hover svg{transform:translateX(3px)}
    :focus-visible{outline:2.5px solid var(--clay);outline-offset:3px}
    .note{margin-top:22px;font-size:.85rem;color:var(--muted)}
    .bar{width:160px;height:3px;border-radius:3px;background:rgba(30,68,52,.12);margin:12px auto 0;overflow:hidden}
    .bar i{display:block;height:100%;background:var(--clay);transform-origin:left;animation:fill 5s linear forwards}
    @keyframes fill{from{transform:scaleX(0)}}
    footer{position:fixed;bottom:22px;left:0;right:0;text-align:center;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(97,92,83,.7);z-index:1}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="glow g1" aria-hidden="true"></div><div class="glow g2" aria-hidden="true"></div>
  <main>
    <a class="brand" href="https://joviahealth.com/" aria-label="Jovia Health">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="26" cy="8.5" r="4.6" fill="#C8693F"/><path d="M26 17.5v8.5a9 9 0 0 1-18 0" stroke="#1E4434" stroke-width="5.2" stroke-linecap="round" fill="none"/></svg>
      <span>jovia</span>
    </a>
    <p class="eyebrow">Paragon Health</p>
    <h1>Paragon Health is now <em>Jovia Health.</em></h1>
    <p class="sub">Health at Paragon AI now lives at Jovia Health: doctor-guided, personalized care, starting with prescription skincare.</p>
    <a class="btn" href="https://joviahealth.com/">Continue to joviahealth.com <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg></a>
    <p class="note" role="status">Taking you there in <span id="s">5</span> seconds…</p>
    <div class="bar" aria-hidden="true"><i></i></div>
  </main>
  <footer>Jovia Health · A Paragon AI company</footer>
  <script>
    (function(){var n=5,el=document.getElementById('s');var t=setInterval(function(){n--;if(n<=0){clearInterval(t);el.textContent='0';window.location.replace('https://joviahealth.com/');}else el.textContent=n;},1000);})();
  </script>
</body>
</html>
